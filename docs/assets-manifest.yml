# Machine-readable inventory of third-party and bundled media in the AVATAR repo.
# Human-readable companion: docs/assets-and-credits.md
#
# Update this file whenever bundled VRM / VRMA / environment media, derived
# thumbnails, installer branding, or documentation screenshots change.
# Run: cd avatar && npm test  (includes manifest path validation)

schema_version: 1
last_audited: "2026-08-19"

# --- Scope legend (field: scope) ---
# ships_in_app     — bundled into production Vite/Electron builds (NSIS installer)
# derived          — committed PNG generated from a ships_in_app parent (npm run thumbs)
# branding         — installer / splash / icon art (not third-party BOOTH media)
# documentation    — docs/screenshots and README GIFs; not shipped inside the app binary
# license_reference — upstream terms text copied beside assets (not played in-app)
# runtime_dependency — npm packages (see package.json); listed for redistributor audits
#
# audit_status: verified | needs_review | arpa_owned
# commercial_use: yes | yes_with_credit | no | user_responsibility | not_applicable

exclusions:
  - id: vroid-hub-session
    note: >
      VRoid Hub hearted / licensed models downloaded at runtime stay in memory for
      the session only. Never commit Hub bytes; conditions-of-use gate is in-app.
  - id: user-directories
    note: >
      Settings → Directories folders (local .vrm / .vrma / env media) and Electron
      userData caches are user-supplied — not inventoried here.
  - id: environments-custom-dev
    note: >
      avatar/src/assets/environments/custom/ is for dev trial media (.gitkeep only
      in repo). Production builds omit custom/ trial GIFs; see docs/environments.md.
  - id: desktop-setup-exe
    note: Gitignored desktop-setup/*.exe release artifacts — not source assets.
  - id: generated-runtime-thumbs
    note: >
      Electron userData/thumbnails/ (custom-folder portraits/posters) are generated
      at runtime from user files — not in this manifest.

