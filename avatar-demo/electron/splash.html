<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:;"
    />
    <title>AVATAR</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
        -webkit-app-region: no-drag;
      }

      .stage {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }

      .logo {
        width: 110px;
        height: 110px;
        object-fit: contain;
        opacity: 1;
        transition: opacity 0.4s ease;
      }

      .logo.is-fading {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <img class="logo" id="logo" alt="" />
    </div>
    <script>
      const { ipcRenderer } = require('electron');
      const fs = require('fs');
      const path = require('path');

      const logo = document.getElementById('logo');
      const logoPath = path.join(__dirname, '..', 'public', 'AVATAR_LOGO_150.png');
      logo.src = `data:image/png;base64,${fs.readFileSync(logoPath).toString('base64')}`;

      ipcRenderer.on('splash:finish', () => {
        logo.classList.add('is-fading');
        window.setTimeout(() => {
          ipcRenderer.send('splash:finished');
        }, 420);
      });
    </script>
  </body>
</html>
