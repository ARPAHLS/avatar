name: Desktop window / overlay
description: Overlay, windowed mode, snap pad, window scale, glass chrome
title: "[Desktop]: "
labels: ["bug", "area:window-desktop", "needs info"]
body:
  - type: markdown
    attributes:
      value: |
        Overlay (pinned) vs windowed, ×0.5 / ×1 / ×2 scale, and the 3×3 snap pad are Electron features. Chrome contrast samples desktop luma after move/focus.

  - type: dropdown
    id: run_mode
    attributes:
      label: How do you run AVATAR?
      options:
        - Windows installer / `npm run desktop`
        - `npm run dev:desktop`
        - Browser (`npm run dev`) — limited
    validations:
      required: true

  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Overlay / always-on-top
        - Windowed mode
        - Window scale (×0.5 / ×1 / ×2)
        - Snap pad
        - Drag / move / bounds
        - Glass bar contrast (too dark / too light)
        - Multi-monitor
        - Other
    validations:
      required: true

  - type: dropdown
    id: overlay
    attributes:
      label: Overlay mode when it happened
      options:
        - Pinned (overlay)
        - Windowed
        - Switching between them
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: scale
    attributes:
      label: Window scale
      options:
        - ×0.5
        - ×1
        - ×2
        - Not sure / mixed
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: input
    id: monitors
    attributes:
      label: Display setup (optional)
      placeholder: e.g. 2 monitors, 125% DPI on primary

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for a duplicate
          required: true
